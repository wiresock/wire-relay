name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets and features
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test unit, binary, and benchmark targets
        run: cargo test --lib --bins --benches --all-features --locked

      - name: Test documentation
        run: cargo test --doc --all-features --locked

      - name: Build release binary
        run: cargo build --release --all-features --locked

  integration:
    name: Integration tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          key: integration-${{ matrix.os }}

      - name: Run integration suites
        run: cargo test --test "*" --all-features --locked

  msrv:
    name: Rust 1.85 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check minimum supported toolchain
        run: cargo check --all-targets --all-features --locked

  aarch64-release:
    name: Linux AArch64 release build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install AArch64 cross toolchain and libc sysroot
        run: |
          set -euo pipefail
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null

          prefer_canonical_apt_mirrors() {
            if [[ -f /etc/apt/apt-mirrors.txt ]]; then
              printf '%s\t%s\n' \
                'http://archive.ubuntu.com/ubuntu/' 'priority:1' \
                'http://security.ubuntu.com/ubuntu/' 'priority:2' |
                sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
          }

          # GitHub-hosted Ubuntu runners prefer azure.archive.ubuntu.com via
          # /etc/apt/apt-mirrors.txt. When that host cannot be resolved, apt
          # still rewrites archive.ubuntu.com and security.ubuntu.com through
          # the same list and the install fails.
          if [[ -f /etc/apt/apt-mirrors.txt ]] &&
            ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            prefer_canonical_apt_mirrors
          fi

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            || {
              prefer_canonical_apt_mirrors
              sudo apt-get update
              sudo apt-get install --yes --no-install-recommends \
                gcc-aarch64-linux-gnu \
                libc6-dev-arm64-cross
            }

      - name: Install stable Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-release

      - name: Build AArch64 release binary
        run: cargo build --release --all-features --locked --target aarch64-unknown-linux-gnu

  versioning:
    name: Version policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version metadata
        run: python3 scripts/versioning/version.py validate

      - name: Reject a non-increasing manual version
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/versioning/version.py compare-refs \
            --base-ref "$BASE_REF" \
            --head-ref HEAD

      - name: Test version helper
        run: python3 -m unittest discover -s scripts/versioning -p "test_*.py"

      - name: Test bootstrap version decisions
        run: bash tests/bootstrap_version_tests.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show ShellCheck version
        run: shellcheck --version

      - name: Lint management scripts
        run: |
          bash -n wire-relay-install.sh tests/bootstrap_version_tests.sh
          shellcheck wire-relay-install.sh tests/bootstrap_version_tests.sh
