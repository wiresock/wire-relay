name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Existing vX.Y.Z tag to build and publish; leave empty for a build-only run"
        required: false
        type: string
  workflow_call:
    inputs:
      release_ref:
        description: "Existing annotated vX.Y.Z tag to build and publish"
        required: true
        type: string
      release_sha:
        description: "Commit that the release tag must resolve to"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

jobs:
  prepare:
    name: Resolve release source
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
      release_ref: ${{ steps.metadata.outputs.release_ref }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Select source ref
        id: source
        shell: bash
        env:
          REQUESTED_RELEASE_REF: ${{ inputs.release_ref }}
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_RELEASE_SHA" ]]; then
            [[ \
              "$REQUESTED_RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ||
              "$REQUESTED_RELEASE_SHA" =~ ^[0-9a-fA-F]{64}$
            ]] || {
              echo "release_sha must be a complete Git object ID." >&2
              exit 1
            }
            source_ref="$REQUESTED_RELEASE_SHA"
          elif [[ -n "$REQUESTED_RELEASE_REF" ]]; then
            [[ "$REQUESTED_RELEASE_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "release_ref must be an existing vX.Y.Z tag." >&2
              exit 1
            }
            source_ref="refs/tags/$REQUESTED_RELEASE_REF"
          else
            source_ref="$GITHUB_SHA"
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_ref }}
          fetch-depth: 0

      - name: Validate release metadata
        id: metadata
        shell: bash
        env:
          REQUESTED_RELEASE_REF: ${{ inputs.release_ref }}
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          python3 scripts/versioning/version.py validate
          version="$(python3 scripts/versioning/version.py get --field version)"
          checked_out_commit="$(git rev-parse HEAD)"
          if [[ -n "$REQUESTED_RELEASE_SHA" ]]; then
            expected_commit="$(
              git rev-parse --verify "${REQUESTED_RELEASE_SHA}^{commit}"
            )"
            [[ "$checked_out_commit" == "$expected_commit" ]] || {
              echo "Checked out $checked_out_commit, expected release commit $expected_commit." >&2
              exit 1
            }
          fi

          release_ref="$REQUESTED_RELEASE_REF"
          if [[ \
            -z "$release_ref" &&
            "$GITHUB_EVENT_NAME" == "push" &&
            "$GITHUB_REF_TYPE" == "tag"
          ]]; then
            release_ref="$GITHUB_REF_NAME"
          fi

          if [[ -n "$release_ref" ]]; then
            git show-ref --verify --quiet "refs/tags/$release_ref" || {
              echo "Release tag $release_ref does not exist." >&2
              exit 1
            }
            [[ "$(git cat-file -t "refs/tags/$release_ref")" == "tag" ]] || {
              echo "Release tag $release_ref must be annotated." >&2
              exit 1
            }
            tag_target="$(git rev-parse "refs/tags/$release_ref^{}")"
            [[ "$tag_target" == "$checked_out_commit" ]] || {
              echo "Release tag $release_ref resolves to $tag_target, but checkout is $checked_out_commit." >&2
              exit 1
            }
            [[ "$release_ref" == "v$version" ]] || {
              echo "Cargo.toml version $version does not match tag $release_ref." >&2
              exit 1
            }
            publish=true
          else
            publish=false
          fi

          {
            echo "publish=$publish"
            echo "release_ref=$release_ref"
            echo "source_sha=$checked_out_commit"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs:
      - prepare
    # Building on the oldest maintained GitHub Ubuntu image reduces the glibc
    # baseline of the dynamically linked GNU artifacts.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            apt_packages: ""
          - target: aarch64-unknown-linux-gnu
            apt_packages: gcc-aarch64-linux-gnu

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install cross linker
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ${{ matrix.apt_packages }}

      - name: Install stable Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --all-features --locked --target "${{ matrix.target }}"

      - name: Package binary and deployment files
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          package="wire-relay-${VERSION}-${{ matrix.target }}"
          mkdir -p "stage/$package/config" "stage/$package/packaging/systemd" dist
          install -m 0755 \
            "target/${{ matrix.target }}/release/wire-relay" \
            "stage/$package/wire-relay"
          install -m 0644 README.md CHANGELOG.md SECURITY.md \
            LICENSE COMMERCIAL-LICENSE.md \
            "stage/$package/"
          install -m 0644 config/config.example.toml "stage/$package/config/"
          install -m 0644 packaging/systemd/wire-relay.service \
            "stage/$package/packaging/systemd/"
          tar -C stage -czf "dist/$package.tar.gz" "$package"

      - name: Upload target archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Download target archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Create source archive and checksums
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git archive \
            --format=tar \
            --prefix="wire-relay-${VERSION}/" \
            HEAD |
            gzip -9 > "dist/wire-relay-${VERSION}-source.tar.gz"
          (
            cd dist
            sha256sum wire-relay-*.tar.gz | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Verify release tag still targets the built commit
        shell: bash
        env:
          RELEASE_REF: ${{ needs.prepare.outputs.release_ref }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin \
            "refs/tags/$RELEASE_REF:refs/tags/$RELEASE_REF"
          [[ "$(git cat-file -t "refs/tags/$RELEASE_REF")" == "tag" ]] || {
            echo "Release tag $RELEASE_REF is no longer annotated." >&2
            exit 1
          }
          current_target="$(git rev-parse "refs/tags/$RELEASE_REF^{}")"
          [[ "$current_target" == "$SOURCE_SHA" ]] || {
            echo "Release tag $RELEASE_REF moved from $SOURCE_SHA to $current_target." >&2
            exit 1
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_ref }}
          generate_release_notes: true
          make_latest: legacy
          fail_on_unmatched_files: true
          files: |
            dist/wire-relay-*.tar.gz
            dist/SHA256SUMS
