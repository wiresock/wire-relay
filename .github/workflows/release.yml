name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

jobs:
  build:
    name: Build ${{ matrix.target }}
    # Building on the oldest maintained GitHub Ubuntu image reduces the glibc
    # baseline of the dynamically linked GNU artifacts.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            apt_packages: ""
          - target: aarch64-unknown-linux-gnu
            apt_packages: gcc-aarch64-linux-gnu

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reject a tag that disagrees with Cargo.toml
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$crate_version" = "$tag_version" || {
            echo "Cargo.toml version $crate_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          }

      - name: Install cross linker
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ${{ matrix.apt_packages }}

      - name: Install stable Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --all-features --locked --target "${{ matrix.target }}"

      - name: Package binary and deployment files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          package="wire-relay-${version}-${{ matrix.target }}"
          mkdir -p "stage/$package/config" "stage/$package/packaging/systemd" dist
          install -m 0755 \
            "target/${{ matrix.target }}/release/wire-relay" \
            "stage/$package/wire-relay"
          install -m 0644 README.md CHANGELOG.md SECURITY.md \
            LICENSE COMMERCIAL-LICENSE.md \
            "stage/$package/"
          install -m 0644 config/config.example.toml "stage/$package/config/"
          install -m 0644 packaging/systemd/wire-relay.service \
            "stage/$package/packaging/systemd/"
          tar -C stage -czf "dist/$package.tar.gz" "$package"

      - name: Upload target archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download target archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Create source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git archive \
            --format=tar \
            --prefix="wire-relay-${version}/" \
            "$GITHUB_SHA" |
            gzip -9 > "dist/wire-relay-${version}-source.tar.gz"
          (
            cd dist
            sha256sum wire-relay-*.tar.gz | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/wire-relay-*.tar.gz
            dist/SHA256SUMS
