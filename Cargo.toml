[package]
name = "wire-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A bounded, transparent UDP relay for WireGuard, AmneziaWG, and other opaque UDP traffic"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Wiresock-Foundation/wire-relay"
readme = "README.md"
keywords = ["udp", "relay", "wireguard", "amneziawg"]
categories = ["network-programming", "command-line-utilities"]
exclude = ["/target", "/target-*"]

[lib]
name = "wire_relay"
path = "src/lib.rs"

[[bin]]
name = "wire-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dashmap = "6.1"
humantime = "2.3"
humantime-serde = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
assert_cmd = "2.0"
criterion = "0.7"
predicates = "3.1"
tempfile = "3.23"

[[bench]]
name = "session_table"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
